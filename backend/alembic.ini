# Alembicの設定ファイル。
# ここに無い設定項目は既定値のまま。項目の一覧は公式ドキュメントを参照。
# https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file

[alembic]
# マイグレーションスクリプトの配置先（%(here)sはこのiniファイルが置かれた位置）
script_location = %(here)s/migrations

# sys.pathへ追加するパス。カレントディレクトリ基準のため、alembicコマンドは
# 必ずbackend/直下で実行する（app配下をimportできるようにするため）
prepend_sys_path = .

# version_locations等のパス区切り文字にos.pathsepを使う
path_separator = os

# DB接続URL（sqlalchemy.url）はここには書かない。
# 秘匿情報をリポジトリに持ち込まないため、env.pyがapp.config.settings
# （環境変数DATABASE_URL）から組み立ててasyncpgドライバへ読み替える。

# 以下はPython標準loggingの設定。alembicコマンドの出力にのみ影響する。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
