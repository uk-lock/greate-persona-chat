# compose.yml単独ではなく、そのオーバーレイとして使う想定（compose.e2e.ymlと同じ形）。
# 例: docker compose -f compose.yml -f compose.prod.yml up -d --build
# API_BASE_URL等の実行時environmentはcompose.yml側で定義済みのため、ここでは
# Dockerfile.prodへの切り替えなど、本番固有の差分のみを上書きする。
services:
  backend:
    build:
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DEBUG: "false"


  frontend:
    build:
      dockerfile: Dockerfile.prod
    restart: unless-stopped
