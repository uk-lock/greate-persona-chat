services:
  backend:
    build:
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: ${IT_DATABASE_URL}
      SIGNUP_ENABLED: ${IT_SIGNUP_ENABLED}
      REPLY_MODEL: ${IT_REPLY_MODEL}
      SELECTION_MODEL: ${IT_SELECTION_MODEL}
      TITLE_MODEL: ${IT_TITLE_MODEL}
      RATE_LIMIT_SIGNUP_PER_HOUR: ${IT_RATE_LIMIT_SIGNUP_PER_HOUR}
      DEBUG: "true"
    working_dir: /workspace/backend
    volumes:
      - .:/workspace


