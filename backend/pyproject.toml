[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008", # FastAPIのDepends()をデフォルト引数に書く慣用パターンのため許容する
]

[tool.pytest.ini_options]
# "."（rootdir=このファイルのあるbackend/）をsys.pathへ追加し、
# 実行時のカレントディレクトリや起動方法によらず`app`パッケージをimport可能にする。
pythonpath = ["."]
# unit/はDB・外部サービスに依存しないUT、integration/は将来追加する実DB前提のIT（tests/README.md参照）。
# デフォルトではunitのみを対象とし、`pytest tests/integration`は明示的に指定した場合のみ実行する。
testpaths = ["tests/unit"]
# tests/integration/llmは実LLM APIを呼ぶ費用のかかるITのため、`pytest tests/integration`の
# 自動探索からは除外する。`pytest tests/integration/llm`と明示的にパスを指定した場合は
# norecursedirsの対象外（明示指定は常に収集される）となり、意図通り実行できる。
norecursedirs = ["tests/integration/llm"]
asyncio_mode = "auto"
